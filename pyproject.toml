[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slanq"
version = "0.1.0"
description = "Compiler for the Slanq quantum programming language"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Simon Adam Imre" }]

dependencies = [
    "lark>=1.1",
    # 2.5: MultiplierGate(n, m) with m < 2n declares fewer qubits than its own
    # definition uses before then (measured: 2.2.1 says 6, the definition needs
    # 8). Transpiling repairs it, so the generated file runs the usual way, but
    # Statevector() on an untranspiled circuit walks into it.
    "qiskit>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "qiskit-aer>=0.17",
]

[project.scripts]
slanq = "slanq.cli:main"

# Every file under src/slanq is included in the distribution, including the
# .lark grammar. This is critical: without it the grammar file would be
# missing from the installed package.
[tool.hatch.build.targets.wheel]
packages = ["src/slanq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = []
# Skipped by default: these compile a file and run it in a fresh interpreter,
# which costs seconds rather than milliseconds. Run them with `-m slow`.
addopts = "-m 'not slow'"
markers = ["slow: compiles and runs the generated file in a separate process"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101 (assert) is off everywhere: a test says what it means with assert,
# and the compiler's own asserts are invariants mypy narrows on.
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["slanq"]
warn_unused_ignores = true
warn_redundant_casts = true
